<!-- intro-banner.html -->
<section id="introBanner" class="relative w-full min-h-screen flex flex-col items-center justify-center overflow-hidden bg-slate-950 px-4 sm:px-8">
    <!-- Ambient Radial Glows -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[320px] sm:w-[600px] h-[320px] sm:h-[600px] bg-cyan-500/15 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute top-1/3 left-1/3 -translate-x-1/2 -translate-y-1/2 w-[250px] sm:w-[450px] h-[250px] sm:h-[450px] bg-blue-600/15 rounded-full blur-[90px] pointer-events-none"></div>

    <!-- Animated Cyber Grid Overlay -->
    <div class="absolute inset-0 cyber-grid pointer-events-none"></div>

    <!-- Interactive Particle Network Canvas -->
    <canvas id="networkCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>

    <!-- Center Stage Motion Graphic Content -->
    <div id="animatedContent" class="relative z-10 max-w-4xl w-full flex flex-col items-center text-center hero-card-float">
        
        <!-- Animated Security Shield & Orbiting Tech Rings -->
        <div class="relative w-28 h-28 sm:w-36 sm:h-36 mb-6 sm:mb-8 flex items-center justify-center reveal-up-1">
            <svg class="absolute inset-0 w-full h-full orbit-ring-outer text-cyan-400/40" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="8 6 2 6" />
            </svg>
            <svg class="absolute inset-2 w-[calc(100%-16px)] h-[calc(100%-16px)] orbit-ring-inner text-blue-400/60" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="45 25 15 25" stroke-linecap="round" />
            </svg>
            <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 border border-cyan-400/50 flex items-center justify-center shield-glow overflow-hidden backdrop-blur-md">
                <div class="scan-line"></div>
                <svg class="w-9 h-9 sm:w-11 sm:h-11 text-cyan-400 drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(6, 182, 212, 0.12)"/>
                    <rect x="9" y="11" width="6" height="5" rx="1" stroke="#38bdf8" stroke-width="1.6" fill="rgba(56, 189, 248, 0.2)"/>
                    <path d="M10 11V9a2 2 0 1 1 4 0v2" stroke="#ffffff" stroke-width="1.6"/>
                    <circle cx="12" cy="13.5" r="0.7" fill="#ffffff"/>
                </svg>
            </div>
        </div>

        <!-- Status Pill Badge -->
        <div class="reveal-up-1 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-950/60 border border-cyan-500/30 backdrop-blur-md mb-5 shadow-[0_0_20px_rgba(6,182,212,0.15)]">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
            </span>
            <span class="font-mono-tech text-[11px] sm:text-xs tracking-widest uppercase text-cyan-300 font-semibold">
                Encrypted &bull; Trusted &bull; Secure
            </span>
        </div>

        <!-- Main Headline -->
        <h1 class="reveal-up-2 text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight leading-tight mb-4 sm:mb-5">
            <span class="block text-slate-200 text-xl sm:text-3xl md:text-4xl font-semibold tracking-normal mb-1 sm:mb-2">
                Welcome to
            </span>
            <span class="gradient-text-flow drop-shadow-[0_0_25px_rgba(56,189,248,0.35)]">
                Fly2Laksh
            </span>
        </h1>

        <!-- Tagline Container -->
        <div class="reveal-up-3 relative inline-block max-w-xl mx-auto">
            <div class="px-6 py-3 sm:px-8 sm:py-3.5 rounded-2xl bg-slate-900/70 border border-slate-700/70 backdrop-blur-xl shadow-2xl relative overflow-hidden">
                <p class="text-base sm:text-xl md:text-2xl font-semibold tracking-wide text-cyan-100 flex items-center justify-center gap-2.5">
                    <svg class="w-5 h-5 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span>Your Data, <span class="text-cyan-400 font-bold">Our Responsibility</span></span>
                </p>
                <div class="absolute bottom-0 h-[2px] bg-gradient-to-r from-transparent via-cyan-400 to-transparent loop-progress"></div>
            </div>
        </div>
    </div>
</section>
